architectury {
    common rootProject.enabled_platforms.split(",")
}

dependencies {
    modImplementation "net.fabricmc:fabric-loader:${rootProject.fabric_loader_version}"

    testImplementation platform("org.junit:junit-bom:5.10.2")
    testImplementation "org.junit.jupiter:junit-jupiter"
    testRuntimeOnly  "org.junit.platform:junit-platform-launcher"
}

repositories {
    mavenCentral()
}

test {
    useJUnitPlatform()
}

/**
 * Walk the launcher-migration scenario over real files on disk, printing each step.
 *   ./gradlew :common:migrationDemo                       (writes under the system temp dir)
 *   ./gradlew :common:migrationDemo --args="/some/dir"    (writes there instead)
 * The demo class lives in the test source set, so it never ships in the mod jar.
 */
tasks.register("migrationDemo", JavaExec) {
    group = "verification"
    description = "Run the Ender Chest store-location migration against real files and print each step."
    classpath = sourceSets.test.runtimeClasspath
    mainClass = "games.brennan.enderchestpersistence.MigrationDemo"
}

publishing {
    publications {
        mavenCommon(MavenPublication) {
            artifactId = "${rootProject.mod_id}-common"
            from components.java
        }
    }
    repositories {
        maven { url "file://${rootProject.projectDir}/repo" }
    }
}
